<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closed Tabs History</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header>
    <h1>Closed tabs</h1>
    <form id="filters">
      <label>When
        <select id="preset">
          <option value="hour">Last hour</option>
          <option value="today">Today</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="all" selected>All</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <span id="custom-range" hidden>
        <label>From <input type="datetime-local" id="from"></label>
        <label>To <input type="datetime-local" id="to"></label>
      </span>
      <label>Search <input type="search" id="text" placeholder="Title or URL"></label>
      <label>Domain <select id="domain"><option value="">All</option></select></label>
      <label>Reason
        <select id="reason">
          <option value="">All</option>
          <option value="logged-out">Logged out</option>
          <option value="duplicate">Duplicate</option>
          <option value="stale">Stale</option>
          <option value="empty">Unused</option>
          <option value="search">Search</option>
        </select>
      </label>
    </form>
    <div class="actions">
      <span class="muted">Export matching records:</span>
      <button type="button" data-export="json">JSON</button>
      <button type="button" data-export="csv">CSV</button>
      <button type="button" data-export="sqlite">SQLite</button>
      <button type="button" id="clear" class="danger">Clear all</button>
    </div>
  </header>
  <main>
    <nav id="day-nav" hidden>
      <button type="button" id="newer">‹ Newer</button>
      <div class="day-heading">
        <h2 id="day-label"></h2>
        <p id="day-count" class="muted"></p>
      </div>
      <button type="button" id="older">Older ›</button>
    </nav>
    <div id="sort-bar" role="group" aria-label="Sort" hidden>
      <span class="muted">Sort:</span>
      <button type="button" data-sort="site" aria-pressed="true">By site</button>
      <button type="button" data-sort="time" aria-pressed="false">Latest first</button>
    </div>
    <div id="timeline"></div>
    <p id="empty" class="muted" hidden>No closed tabs match these filters.</p>
  </main>
  <dialog id="clear-dialog" aria-labelledby="clear-title">
    <form id="clear-form">
      <h2 id="clear-title">Clear all history?</h2>
      <p id="clear-summary"></p>
      <p>A JSON backup of every entry is downloaded first. Then every entry is deleted from this computer, whatever filters are set. This can't be undone.</p>
      <label class="block" for="clear-phrase">Type <strong id="clear-phrase-text"></strong> to continue:</label>
      <input id="clear-phrase" autocomplete="off" spellcheck="false">
      <p id="clear-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="clear-cancel">Cancel</button>
        <button type="submit" id="clear-confirm" class="danger" disabled>Download backup and clear</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="history.js"></script>
</body>
</html>
